<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화면② 채점 상세 — 목업</title>
<style>
  :root{
    --bg:#f6f4ee; --card:#ffffff; --border:#e7e2d3; --text:#2b2a26; --sub:#8a8578;
    --danger-bg:#f8e9e7; --danger-text:#b5473f;
    --warn-bg:#f5eedb; --warn-text:#a9822f;
    --ok-bg:#eef1e2; --ok-text:#7a8450;
    --na-bg:#eeece5; --na-text:#8a8578;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);padding:28px;}
  .shell{max-width:1180px;margin:0 auto;}
  .mock-banner{background:#fff3cd;border:1px solid #f0e0a0;color:#7a5c00;font-size:12px;padding:8px 14px;border-radius:8px;margin-bottom:16px;line-height:1.7;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 22px;}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:9px 16px;border-radius:999px;font-size:14px;color:var(--sub);border:1px solid transparent;text-decoration:none;}
  .tab.active{background:var(--text);color:#fff;font-weight:600;}
  .tab:not(.active){cursor:pointer;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .back-link{font-size:13px;color:var(--sub);text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
  .title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .title-row h1{font-size:20px;margin:0;}
  .meta-chip{font-size:12px;color:var(--sub);}
  .status-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .status-정상{background:var(--ok-bg);color:var(--ok-text);}
  .status-저점수{background:var(--warn-bg);color:var(--warn-text);}
  .status-불완전판매{background:var(--danger-bg);color:var(--danger-text);}

  .main-grid{display:grid;grid-template-columns:1fr 380px;gap:16px;}
  @media (max-width:900px){.main-grid{grid-template-columns:1fr;}}

  .section-title{font-size:14px;font-weight:700;margin:0 0 10px 0;}

  .transcript{max-height:600px;overflow-y:auto;padding-right:4px;}
  .turn{padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:13px;line-height:1.6;transition:background .3s;}
  .turn.agent{background:#f7f5ee;}
  .turn.customer{background:#fbfaf6;}
  .turn .ts{color:var(--sub);font-size:11px;margin-right:6px;}
  .turn .speaker{font-weight:700;margin-right:4px;}
  .turn.highlight{background:#fdeee9;box-shadow:0 0 0 2px var(--danger-text) inset;}

  .item-list{display:flex;flex-direction:column;gap:0;max-height:600px;overflow-y:auto;}
  .domain-header{font-size:11px;font-weight:700;color:var(--sub);padding:10px 4px 4px;}
  .item-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 8px;border-radius:10px;cursor:pointer;font-size:13px;
  }
  .item-row:hover{background:#f1efe6;}
  .item-row.selected{background:#f1efe6;box-shadow:0 0 0 1px var(--border) inset;}
  .item-row.na{opacity:.55;cursor:default;}
  .item-row .code{color:var(--sub);font-size:11px;margin-right:6px;}
  .item-row .score{font-weight:700;white-space:nowrap;}

  .total-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:12px;border-top:1px solid var(--border);font-weight:700;}
  .total-row .big{font-size:22px;}

  .comment-box{margin-top:10px;font-size:12px;color:var(--sub);background:#f7f5ee;border-radius:10px;padding:10px;display:none;}
  .comment-box.show{display:block;}

  .actions-bar{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
  .btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:9px 14px;border-radius:10px;font-size:13px;cursor:pointer;}
  .btn.primary{background:var(--text);color:#fff;border-color:var(--text);font-weight:600;}

  .footnote{font-size:11px;color:var(--sub);margin-top:16px;line-height:1.7;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--sub);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>

</div>

  { dialogue_id: 509, dialogue_code: "dummy_05-009", turn_order: 9,  speaker: "상담사", offset_sec: 66,  content: "아, 죄송합니다. 월급 들어오자마자 빠져나가면 부담되셨겠어요. 다시 확인해 보니 5일·15일·25일·말일 네 가지 중 선택 가능합니다. 말일로 해드릴까요?" },
  { dialogue_id: 510, dialogue_code: "dummy_05-010", turn_order: 10, speaker: "고객",   offset_sec: 78,  content: "네, 말일로 해주세요." },
  { dialogue_id: 511, dialogue_code: "dummy_05-011", turn_order: 11, speaker: "상담사", offset_sec: 85,  content: "네, 처리 중입니다. 잠시만 기다려 주세요. 확인되었습니다. 다음 달부터 말일 자동이체로 변경됩니다." },
  { dialogue_id: 512, dialogue_code: "dummy_05-012", turn_order: 12, speaker: "상담사", offset_sec: 102, content: "정리해 드리면, 보험료 자동이체일이 매월 5일에서 말일로 변경되었고 다음 달 납입분부터 적용됩니다. 더 필요하신 사항 없으실까요?" },
  { dialogue_id: 513, dialogue_code: "dummy_05-013", turn_order: 13, speaker: "고객",   offset_sec: 115, content: "없어요. 감사합니다." },
  { dialogue_id: 514, dialogue_code: "dummy_05-014", turn_order: 14, speaker: "상담사", offset_sec: 122, content: "네, 추가 문의는 언제든 고객센터로 연락 주세요. 이용해 주셔서 감사합니다. 좋은 하루 되세요." },
];

function formatTs(offsetSec){
  const m = Math.floor(offsetSec/60), s = offsetSec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

const ITEM_NAMES = {
  A1:"맞이인사 및 소속·성명 밝히기", A2:"고객 본인확인", A3:"경청 및 용건·니즈 파악",
  B1:"정보 정확성", B2:"쉬운 설명", B3:"적극적 해결·대안 제시", B4:"신속·효율적 처리",
  C1:"공감 표현", C2:"친절·언어예절", C3:"감정 대응",
  D1:"중요사항 설명의무", D2:"적합성 원칙(절차+결과)", D3:"고지의무 안내",
  D4:"면책·부지급 사유 설명", D5:"청약철회·해피콜 안내", D6:"허위·과장 및 부당권유 금지",
  E1:"처리내용 재확인·이해 점검", E2:"종료 인사·추가 안내"
};
// 영역 표시명은 화면③·④와 통일(화면④ 계약 §3.2·v1.3): C=태도·공감. '경청'은 A3(경청 및 용건·니즈 파악)와 겹쳐 금지.
const DOMAIN_NAMES = { A:"상담 도입", B:"업무처리", C:"태도·공감", D:"보험특화(불완전판매 방지)", E:"상담 마무리" };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function statusClassName(label){
  if(label==="불완전판매 의심") return "status-불완전판매";
  if(label==="저점수") return "status-저점수";
  return "status-정상";
}
function levelClass(level){
  if(level==="충족") return "status-정상";
  if(level==="부분충족") return "status-저점수";
  if(level==="미충족") return "status-불완전판매";
  return ""; // 해당없음
}

function renderNotFound(evaluationId, message){
  document.getElementById("content").innerHTML = `
    <div class="card empty-state">
      <p>evaluation_id <b>${evaluationId}</b> — ${message ?? "평가를 찾을 수 없음"}</p>
      <p style="font-size:12px;">재채점 시 evaluation_id가 재발급되므로 이전 ID는 404가 정상입니다 (계약 §5). 목록에서 다시 진입하세요.</p>
      <p><a href="test-live-screen1.html" class="btn" style="text-decoration:none;display:inline-block;margin-top:8px;">← 목록으로</a></p>
    </div>`;
}

function renderCase(header, evaluation, dialogues){
  document.getElementById("content").innerHTML = `
    <div class="topbar">
      <div>
        <a class="back-link" href="test-live-screen1.html">← 목록으로</a>
        <div class="title-row">
          <h1>${header.consultation_code}</h1>
          <span class="meta-chip">${header.agent_name} · ${header.consult_type}</span>
          ${header.risk_flagged ? '<span class="meta-chip" style="color:var(--danger-text);">● 위험</span>' : ''}
          ${header.status_labels.map(l=>`<span class="status-pill ${statusClassName(l)}">${l}</span>`).join(" ")}
        </div>
      </div>
    </div>
    <div class="main-grid">
      <div class="card">
        <p class="section-title">상담 텍스트 원문</p>
        <div class="transcript" id="transcript"></div>
      </div>
      <div class="card">
        <p class="section-title">항목별 채점 · 클릭하면 근거 발화로 이동</p>
        <div class="item-list" id="itemList"></div>
        <div class="total-row">
          <span>총점</span>
          <span class="big">${evaluation.집계.환산총점} / 100</span>
        </div>
        <div class="comment-box" id="commentBox">목업: 실제 코멘트 저장 기능은 다음 단계에서 구현됩니다.</div>
        <div class="actions-bar">
          <button class="btn" onclick="toggleComment()">코멘트</button>
          <button class="btn" onclick="toast('목업: 점수 수정 UI는 다음 단계에서 구현')">점수수정</button>
          <button class="btn primary" onclick="toast('검수확정 처리(목업 — 실제 저장 없음)')">검수확정</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <p class="section-title">요약 · 종합피드백</p>
      <p style="font-size:13px;margin:0 0 10px;">${evaluation.요약}</p>
      <p style="font-size:13px;color:var(--sub);margin:0;">${evaluation.종합피드백}</p>
    </div>
  `;

  // 좌측 원문 — turn_order 오름차순, dialogue_id를 DOM id로 사용(숫자 점프 키)
  const transcriptEl = document.getElementById("transcript");
  transcriptEl.innerHTML = [...dialogues].sort((a,b)=>a.turn_order-b.turn_order).map(d => `
    <div class="turn ${d.speaker==='상담사'?'agent':'customer'}" id="turn-${d.dialogue_id}">
      <span class="ts">[${formatTs(d.offset_sec)}]</span><span class="speaker">${d.speaker}:</span>${d.content}
    </div>
  `).join("");

  // 우측 항목 목록 (영역별 그룹) — 출력스키마 ver2 한글 키 그대로(결정1)
  const byDomain = {};
  evaluation.항목평가.forEach(it => { const d = it.항목코드[0]; (byDomain[d] ??= []).push(it); });

  const itemListEl = document.getElementById("itemList");
  itemListEl.innerHTML = "";
  Object.keys(byDomain).forEach(d => {
    itemListEl.innerHTML += `<div class="domain-header">${d}. ${DOMAIN_NAMES[d]}</div>`;
    byDomain[d].forEach(it => {
      const isNA = it.충족수준 === "해당없음";
      const hasEvidence = !!(it.근거 && it.근거.length);
      // 근거가 여러 개면 첫 근거로 점프(계약 §4-2). dialogue_id가 점프 키(숫자), 대화ID는 표시용.
      const firstEvidence = hasEvidence ? it.근거[0] : null;
      const jumpId = (firstEvidence && firstEvidence.dialogue_id != null) ? firstEvidence.dialogue_id : "";
      itemListEl.innerHTML += `
        <div class="item-row ${isNA?'na':''}" data-code="${it.항목코드}" data-jump="${jumpId}" data-has-evidence="${hasEvidence}">
          <span><span class="code">${it.항목코드}</span>${ITEM_NAMES[it.항목코드]}</span>
          <span class="score">
            ${isNA ? '<span class="meta-chip">N/A</span>' : `<span class="status-pill ${levelClass(it.충족수준)}">${it.충족수준}</span> ${it.획득점수}/${it.배점}`}
          </span>
        </div>`;
    });
  });

  itemListEl.querySelectorAll(".item-row").forEach(row => {
    row.addEventListener("click", () => {
      const jump = row.getAttribute("data-jump");
      const hasEvidence = row.getAttribute("data-has-evidence") === "true";
      itemListEl.querySelectorAll(".item-row").forEach(r=>r.classList.remove("selected"));
      row.classList.add("selected");
      document.querySelectorAll(".turn").forEach(t=>t.classList.remove("highlight"));
      if(jump !== ""){
        const target = document.getElementById(`turn-${jump}`);
        if(target){
          target.classList.add("highlight");
          // 일부 구형/제한된 뷰어에는 scrollIntoView가 없을 수 있어 방어적으로 체크(이전 Chart.js 사고 재발 방지).
          if(typeof target.scrollIntoView === "function"){
            try { target.scrollIntoView({ behavior: "smooth", block: "center" }); } catch(e){ /* 무시 */ }
          }
          return;
        }
      }
      if(hasEvidence){
        // dialogue_id === null (인용 대조 실패, 계약 §4-4) — 근거는 있으나 점프는 안 됨
        toast("근거 발화를 특정할 수 없는 항목입니다(인용문만 표시).");
      } else {
        toast("이 항목은 해당없음(N/A)이라 근거 발화가 없습니다.");
      }
    });
  });

  document.getElementById("footnote").innerHTML = `
    * <code>evaluation</code> 블록은 출력스키마 ver2 한글 키 그대로입니다(화면② 계약 결정1 — 앱 API 영문 규약의 예외 허용). 항목명·영역명은 응답에 없어 프론트 상수(<code>ITEM_NAMES</code>/<code>DOMAIN_NAMES</code>)로 유지합니다.<br>
    * 점프는 <code>근거[].dialogue_id</code>(숫자, 인용 대조로 확정된 내부 키) 기준. <code>대화ID</code>(예: C-2026-018442-002)는 표시·대조용으로 병행 제공됩니다.<br>
    * "N/A"로 표시된 D1~D5는 이 상담에 신규 권유가 없어 해당없음 처리된 것(문제가 있었던 게 아님) — CLAUDE.md §5.3 N/A 규칙.<br>
    * <b>evaluation_id는 재채점 시 새로 발급됩니다.</b> URL 북마크·외부 저장 키로 쓰지 않습니다(팀 결정 2026-07-06).
  `;
}

function toggleComment(){
  document.getElementById("commentBox").classList.toggle("show");
}

(async function init(){
  try {
    const params = new URLSearchParams(location.search);
    // 실연동: 파라미터 없으면 105(dummy_05)로 — 하드코딩 상수는 폴백 참고용으로만 남김
    const requestedId = params.get("evaluation_id") ?? EVALUATION.evaluation_id;

    const res = await fetch(`/api/evaluations/${requestedId}`);
    if(res.status === 404 || res.status === 400){
      const body = await res.json().catch(()=>({}));
      renderNotFound(requestedId, body.error);
      return;
    }
    if(!res.ok) throw new Error(`API ${res.status}`);

    const d = await res.json(); // { header, evaluation, dialogues, review } — 계약 v1.1 4블록
    renderCase(d.header, d.evaluation, d.dialogues);
    if(d.review){
      console.log("review 블록 수신(검수 존재):", d.review); // 검수 UI는 FE 이식 범위 — 여기선 수신만 확인
    }
  } catch (err) {
    console.error("실연동 오류:", err);
    document.getElementById("shell").insertAdjacentHTML(
      "afterbegin",
      `<div class="mock-banner" style="background:#f8e9e7;border-color:#edcfcb;color:#b5473f;">⚠ API 연동 오류: ${err.message} — qa-app(3000)·qa-mysql 컨테이너 기동 여부를 확인하세요.</div>`
    );
  }
})();
</script>
